<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie – Infiniment Autiste 77</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, Arial;
      background: #f6f8fb;
      margin: 0;
      padding: 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: .5rem;
    }

    p {
      text-align: center;
      color: #555;
    }

    .galerie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));

    .galerie-grid img {

      height: auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.15);
    }

    .retour {
      display: block;
      text-align: center;
      margin: 2rem 0;
    }
  </style>
</head>

<body>

<h1>📸 Galerie</h1>
<p>Quelques souvenirs de nos moments partagés</p>

<div class="galerie-grid">
  <img src="images/galerie/duautiste.jpg" alt="Samy & Milo">
  <img src="images/galerie/buffet1.jpg" alt="Buffet">
  <img src="images/galerie/buffet2.jpg" alt="Buffet">
  <img src="images/galerie/halloween1.jpg" alt="Halloween">
  <img src="images/galerie/halloween2.jpg" alt="Halloween">
  <img src="images/galerie/halloween3.jpg" alt="Halloween">
  <img src="images/galerie/affiches.jpg" alt="Affiches">
